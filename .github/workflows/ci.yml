name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  iron-laws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pwsh -NoProfile -Command ./scripts/verify-specs.ps1
        name: L1 spec-is-truth gate
      - run: pwsh -NoProfile -Command ./scripts/verify-corpus.ps1
        name: L3 corpus gate
      - run: |
          moon run cmd --target js -- list-checks > /tmp/checks.js.txt
          moon run cmd --target native -- list-checks > /tmp/checks.native.txt
          diff /tmp/checks.js.txt /tmp/checks.native.txt
        name: L2 dual-backend consensus gate
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - run: moon check --target ${{ matrix.target }}

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - run: moon test --target ${{ matrix.target }}

  e2e:
    runs-on: ubuntu-latest
    needs: [check, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash scripts/ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mcpconftest-report
          path: mcpconftest-report/

  release-build:
    runs-on: ubuntu-latest
    needs: [check, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - run: moon build --target js --release
      - run: moon build --target native --release
      - uses: actions/upload-artifact@v4
        with:
          name: mcpconftest-native-linux
          path: _build/native/release/build/cmd/cmd
      - uses: actions/upload-artifact@v4
        with:
          name: mcpconftest-js-bundle
          path: _build/js/release/build/cmd/mcpconftest.js
