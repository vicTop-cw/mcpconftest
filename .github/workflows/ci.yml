name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - name: moon check (${{ matrix.target }})
        run: moon check --target ${{ matrix.target }}

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - name: moon test (${{ matrix.target }})
        run: moon test --target ${{ matrix.target }}

  e2e:
    runs-on: ubuntu-latest
    needs: [check, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run local CI gate (moon check + moon test + e2e fixture)
        run: bash scripts/ci.sh

  iron-laws:
    runs-on: windows-latest
    needs: [check, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build js backend (for list-checks)
        run: moon build --target js
      - name: L1 - spec is source of truth (specs vs list-checks)
        run: pwsh -File scripts/verify-specs.ps1
      - name: L3 - corpus coverage
        run: pwsh -File scripts/verify-corpus.ps1

  release-build:
    runs-on: ubuntu-latest
    needs: [check, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - name: moon build --target js --release
        run: moon build --target js --release
      - name: moon build --target native --release
        run: moon build --target native --release
